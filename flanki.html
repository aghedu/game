<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flanki</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="arrow-buttons">
      <button id="arrow-up" class="arrow-button"></button>
    </div>
    <script>
      const audio = new Audio("sounds/flanki.mp3");
      audio.loop = true;
      audio.volume = 0.1;
      window.pageAudio = audio;
      let hasInteracted = false;
      const tryPlay = () => {
        if (hasInteracted) return;
        audio
          .play()
          .then(() => (hasInteracted = true))
          .catch(() => {});
      };
      ["click", "keydown", "touchstart", "pointerdown", "devicemotion"].forEach(
        (ev) => document.addEventListener(ev, tryPlay)
      );
    </script>
    <script type="module" src="./flanki.js"></script>
  </body>
</html>
