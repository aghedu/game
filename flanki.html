<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flanki</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="arrow-buttons">
      <button id="arrow-up" class="arrow-button"></button>
    </div>
    <script>
      const audio = new Audio("sounds/flanki.mp3");
      audio.preload = "auto";
      audio.loop = true;
      window.pageAudio = audio;
      let hasInteracted = false;

      function startAudio() {
        if (!audio) return;
        audio.volume = 0.1;
        audio
          .play()
          .then(() => (hasInteracted = true))
          .catch(() => {/* wait for next user gesture */});
      }

      const interactionEvents = [
        "click",
        "keydown",
        "touchstart",
        "pointerdown",
        "devicemotion",
      ];
      const tryStart = () => { if (!hasInteracted) startAudio(); };
      interactionEvents.forEach((e) => document.addEventListener(e, tryStart, { passive: true }));

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && hasInteracted) startAudio();
      });
      window.addEventListener("pageshow", () => {
        if (hasInteracted) startAudio();
      });
    </script>
    <script type="module" src="./flanki.js"></script>
  </body>
</html>
