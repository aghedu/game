<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Łapanie</title>
    <link rel="stylesheet" href="lapanie.css" />
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="arrow-buttons">
      <button id="arrow-left" class="arrow-button"></button>
      <button id="arrow-right" class="arrow-button"></button>
    </div>
    <audio id="background-music" loop>
      <source src="sounds/lapanie.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <script>
      const audio = new Audio("sounds/lapanie.mp3");
      audio.loop = true;
      window.pageAudio = audio;
      let hasInteracted = false;

      function startAudio() {
        if (!audio) return;
        audio.volume = 0.075;
        audio
          .play()
          .then(() => (hasInteracted = true))
          .catch(() => setTimeout(startAudio, 800));
      }

      const interactionEvents = [
        "click",
        "keydown",
        "touchstart",
        "pointerdown",
        "devicemotion",
      ];
      interactionEvents.forEach((e) =>
        document.addEventListener(e, () => {
          if (!hasInteracted) startAudio();
        }, { once: true })
      );

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && hasInteracted) startAudio();
      });
      window.addEventListener("pageshow", () => {
        if (hasInteracted) startAudio();
      });
    </script>
    <script type="module" src="lapanie.js"></script>
  </body>
</html>
