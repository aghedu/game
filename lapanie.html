<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Łapanie</title>
    <link rel="stylesheet" href="lapanie.css" />
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="arrow-buttons">
      <button id="arrow-left" class="arrow-button"></button>
      <button id="arrow-right" class="arrow-button"></button>
    </div>
    <audio id="background-music" loop>
      <source src="sounds/lapanie.mp3" type="audio/mpeg" />
      Your browser does not support the audio element.
    </audio>
    <script>
      const audio = new Audio("sounds/lapanie.mp3");
      audio.loop = true;
      audio.volume = 0.075;
      window.pageAudio = audio;
      let hasInteracted = false;
      const tryPlay = () => {
        if (hasInteracted) return;
        audio
          .play()
          .then(() => (hasInteracted = true))
          .catch(() => {
            // Some browsers need a direct user gesture; we'll try again on next event
          });
      };
      ["click", "keydown", "touchstart", "pointerdown", "devicemotion"].forEach((ev) =>
        document.addEventListener(ev, tryPlay, { once: false })
      );
    </script>
    <script type="module" src="lapanie.js"></script>
  </body>
</html>
